# Include in Nginx's http context (the usual conf.d/*.conf include).
# Replace the TLS paths and upstream name for the deployment.
limit_req_zone $binary_remote_addr zone=grimmlink_auth:10m rate=20r/m;

server {
    listen 443 ssl;
    server_name grimmlink.example.com;

    ssl_certificate     /etc/letsencrypt/live/grimmlink.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grimmlink.example.com/privkey.pem;

    # All local UI, diagnostics, OPF/sidecar, and automation paths are LAN-only.
    location ^~ /api/grimmlink/v2/local/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow fc00::/7;
        allow fe80::/10;
        deny all;

        proxy_pass http://grimmlink-adapter:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root redirects to the local management UI, so keep it private too.
    location = / {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow fc00::/7;
        allow fe80::/10;
        deny all;
        proxy_pass http://grimmlink-adapter:8085;
    }

    # Protect the credential exchange from brute-force attempts without
    # throttling routine sync, shelf pagination, or book downloads.
    location = /api/grimmlink/v2/auth/session {
        limit_req zone=grimmlink_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://grimmlink-adapter:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Book metadata reads/writes are management operations and stay on LAN.
    # Keep this regex before the general v2 prefix; that prefix must not use ^~.
    location ~ ^/api/grimmlink/v2/books/[0-9]+/metadata$ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow fc00::/7;
        allow fe80::/10;
        deny all;

        proxy_pass http://grimmlink-adapter:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public reader APIs. Keep all local paths out of this handler.
    location /api/grimmlink/v2/ {
        proxy_pass http://grimmlink-adapter:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Do not publish legacy v1, FastAPI docs, healthcheck, or other routes.
    location / {
        return 404;
    }
}
